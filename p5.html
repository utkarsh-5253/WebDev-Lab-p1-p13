<!DOCTYPE html>
<html>

<head>
    <title>Flexbox Layout</title>

    <style>

        nav {
            display: flex;
            justify-content: space-around;
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .cards {
            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            padding: 20px;
        }

        .card {
            border: 1px solid black;
            padding: 20px;

            flex: 1;

            min-width: 200px;
        }

        .card h2 {
            margin-top: 0;
        }


        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .cards {
                flex-direction: column;
            }

        }

    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

    </nav>


    <h1>My Projects</h1>


    <div class="cards">

        <div class="card">
            <h2>Project 1</h2>

            <p>
                This is my CSS project.
            </p>
        </div>


        <div class="card">
            <h2>Project 2</h2>

            <p>
                This is my HTML project.
            </p>
        </div>


        <div class="card">
            <h2>Project 3</h2>

            <p>
                This is my DSA project.
            </p>
        </div>


        <div class="card">
            <h2>Project 4</h2>

            <p>
                This is my WEB DEV project.
            </p>
        </div>

    </div>

</body>

</html>
